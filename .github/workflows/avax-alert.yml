name: AVAX Kronos Alert
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas numpy torch "huggingface_hub>=0.24.0" "safetensors>=0.4.3" einops plotly kaleido
      - run: python kronos_alert.py
      - name: Commit forecast history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add forecast_history/kronos_forecasts.csv docs/index.html
          git diff --staged --quiet || git commit -m "Update forecast history [skip ci]"
          git push
